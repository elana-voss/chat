<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal Chat UI</title>
  
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; display: flex; height: 100vh; background: #1a1a1a; color: #fff; overflow: hidden; }
    
    /* --- SIDEBAR / LEFT RAIL --- */
    #sidebar { 
      width: 260px; background: #222; border-right: 1px solid #333; 
      display: flex; flex-direction: column; transition: width 0.2s ease; overflow: hidden; flex-shrink: 0;
    }
    #sidebar.collapsed { width: 0; border-right: none; }
    
    .sidebar-header { padding: 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; background: #1a1a1a; }
    .new-chat-btn { width: 100%; padding: 8px; background: #0066cc; border: none; border-radius: 4px; color: #fff; font-weight: 500; cursor: pointer; }
    .new-chat-btn:hover { background: #0052a3; }
    
    .sidebar-chats { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 4px; }
    .chat-item { 
      padding: 8px 10px; border-radius: 4px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; 
      font-size: 14px; color: #ccc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; 
    }
    .chat-item:hover { background: #2a2a2a; color: #fff; }
    .chat-item.active { background: #333; color: #fff; font-weight: 500; border-left: 3px solid #0066cc; }
    .chat-item-title { flex: 1; overflow: hidden; text-overflow: ellipsis; }
    .chat-item-delete { background: none; border: none; color: #888; cursor: pointer; font-size: 14px; padding: 2px 6px; visibility: hidden; }
    .chat-item:hover .chat-item-delete { visibility: visible; }
    .chat-item-delete:hover { color: #ff4d4d; }

    /* --- MAIN CONTENT AREA --- */
    .main-content { flex: 1; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    
    #config { 
      display: flex; flex-wrap: wrap; gap: 12px; align-items: center; 
      padding: 12px 16px; background: #2a2a2a; border-bottom: 1px solid #333; 
    }
    
    .hamburger-btn { background: #333; border: 1px solid #444; color: #fff; font-size: 16px; padding: 8px 12px; border-radius: 4px; cursor: pointer; }
    .hamburger-btn:hover { background: #444; }

    input[type="text"], input[type="password"], button { padding: 8px 10px; border-radius: 4px; border: 1px solid #444; background: #333; color: #fff; font-size: 14px; }
    
    #baseUrl { width: 220px; }
    #apiKey { width: 120px; }

    .filter-wrapper { position: relative; display: inline-flex; align-items: center; }
    .filter-wrapper input { padding-right: 26px; width: 140px; }
    #clearFilterBtn {
      position: absolute; right: 8px; cursor: pointer; color: #888;
      font-size: 16px; line-height: 1; display: none; user-select: none; font-weight: bold;
    }
    #clearFilterBtn:hover { color: #fff; }

    .custom-select-wrapper { position: relative; flex: 1; min-width: 200px; max-width: 450px; }
    .custom-select-display {
      padding: 8px 10px; border-radius: 4px; border: 1px solid #444; background: #333; color: #fff; font-size: 14px;
      cursor: pointer; user-select: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      display: flex; justify-content: space-between; align-items: center;
    }
    .custom-select-display::after { content: '▼'; font-size: 10px; margin-left: 8px; color: #888; flex-shrink: 0; }
    .custom-select-options {
      display: none; position: absolute; top: 100%; left: 0; margin-top: 4px;
      background: #2a2a2a; border: 1px solid #555; border-radius: 4px;
      max-height: 50vh; overflow-y: auto; width: max-content; min-width: 100%; max-width: 500px; 
      z-index: 1000; box-shadow: 0 8px 16px rgba(0,0,0,0.6);
    }
    .custom-select-options.show { display: block; }
    
    .dropdown-group-label {
      padding: 6px 10px; font-size: 12px; font-weight: bold; color: #aaa; background: #1f1f1f; text-transform: uppercase;
      position: sticky; top: 0; z-index: 2;
    }
    .dropdown-option {
      padding: 8px 12px; cursor: pointer; font-size: 14px; color: #fff; transition: background 0.1s;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .dropdown-option:hover { background: #0066cc; }
    
    button { cursor: pointer; background: #444; border-color: #555; transition: background 0.2s; }
    button:hover { background: #555; }
    button.stop-btn { background: #d9534f; border-color: #c9302c; }
    button.stop-btn:hover { background: #c9302c; }

    label { display: flex; align-items: center; gap: 6px; font-size: 14px; cursor: pointer; white-space: nowrap; user-select: none; }
    
    #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 85%; padding: 10px 14px; border-radius: 8px; word-break: break-word; }
    .user { align-self: flex-end; background: #0066cc; white-space: pre-wrap; }
    .assistant { align-self: flex-start; background: #333; border: 1px solid #444; }
    
    .assistant p { margin: 0 0 10px 0; line-height: 1.5; }
    .assistant p:last-child { margin: 0; }
    .assistant pre { background: #000; padding: 12px; border-radius: 6px; overflow-x: auto; margin: 8px 0; border: 1px solid #444; }
    .assistant code { background: #000; padding: 2px 4px; border-radius: 4px; font-family: monospace; font-size: 0.9em; color: #ffcc00; }
    .assistant pre code { color: #e6e6e6; padding: 0; }
    .assistant table { border-collapse: collapse; margin: 10px 0; width: 100%; }
    .assistant th, .assistant td { border: 1px solid #555; padding: 8px; text-align: left; }
    .assistant th { background: #222; }

    /* --- THINKING BLOCKS --- */
    .thinking-block {
      margin: 10px 0;
      border: 1px solid #444;
      border-radius: 6px;
      background: #222;
      overflow: hidden;
    }
    .thinking-block summary {
      cursor: pointer;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
      color: #aaa;
      background: #2a2a2a;
      user-select: none;
      transition: background 0.2s, color 0.2s;
    }
    .thinking-block summary:hover {
      background: #333;
      color: #fff;
    }
    .thinking-content {
      border-top: 1px solid #444;
      padding: 12px;
      font-size: 13.5px;
      color: #bbb;
      white-space: pre-wrap;
      background: #1a1a1a;
      font-family: monospace;
    }

    #input-box { display: flex; padding: 12px; gap: 8px; background: #2a2a2a; border-top: 1px solid #333; }
    #message-input { flex: 1; font-size: 16px; }
  </style>
</head>
<body>

  <!-- Collapsible Left Rail / Sidebar -->
  <div id="sidebar">
    <div class="sidebar-header">
      <button class="new-chat-btn" onclick="createNewChat()">+ New Chat</button>
    </div>
    <div class="sidebar-chats" id="sidebarChatsList"></div>
  </div>

  <!-- Main Content Area -->
  <div class="main-content">
    <div id="config">
      <button class="hamburger-btn" onclick="toggleSidebar()" title="Toggle Sidebar">☰</button>
      <input type="text" id="baseUrl" placeholder="Base URL" value="https://nano-gpt.com/api/v1" onchange="saveConfig(); fetchModels();" oninput="updateSubOnlyVisibility()">
      <input type="password" id="apiKey" placeholder="API Key" onchange="saveConfig(); fetchModels();" oninput="onKeyInput()">
      
      <label id="subOnlyContainer">
        <input type="checkbox" id="subOnly" onchange="fetchModels()"> Sub Only
      </label>
      
      <div class="filter-wrapper">
        <input type="text" id="modelFilter" placeholder="Filter models..." oninput="applyModelFilter()">
        <span id="clearFilterBtn" onclick="clearFilter()">&times;</span>
      </div>
      
      <div class="custom-select-wrapper" id="customModelSelect">
        <div class="custom-select-display" onclick="toggleDropdown()" title="Select Model">Select Model</div>
        <div class="custom-select-options" id="dropdownMenu"></div>
      </div>
    </div>

    <div id="chat"></div>

    <div id="input-box">
      <input type="text" id="message-input" placeholder="Type your message..." onkeydown="if(event.key==='Enter') handleSendClick()">
      <button id="sendBtn" onclick="handleSendClick()">Send</button>
    </div>
  </div>

<script>
    let chats = [];
    let currentChatId = null;
    let allModels = [];
    let currentAbortController = null;
    let keyDebounceTimer = null;
    
    let selectedModelId = "";
    let selectedModelName = "Select Model";

    window.addEventListener('DOMContentLoaded', () => {
      const savedUrl = localStorage.getItem('chat_base_url');
      const savedKey = localStorage.getItem('chat_api_key');
      if (savedUrl) document.getElementById('baseUrl').value = savedUrl;
      
      updateSubOnlyVisibility();
      
      if (savedKey) {
        document.getElementById('apiKey').value = savedKey;
        fetchModels();
      }

      loadChatsFromStorage();
      
      if (chats.length > 0) {
        switchChat(chats[0].id);
      } else {
        createNewChat();
      }

      focusInput();
    });

    function updateSubOnlyVisibility() {
      const baseUrl = document.getElementById('baseUrl').value.trim().toLowerCase();
      const subOnlyContainer = document.getElementById('subOnlyContainer');
      if (baseUrl.includes('nano-gpt')) {
        subOnlyContainer.style.display = 'flex';
      } else {
        subOnlyContainer.style.display = 'none';
        document.getElementById('subOnly').checked = false; // reset when hidden
      }
    }

    function focusInput() {
      document.getElementById('message-input').focus();
    }

    function scrollToBottom() {
      const chat = document.getElementById('chat');
      setTimeout(() => { chat.scrollTop = chat.scrollHeight; }, 10);
    }

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('collapsed');
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function extractAndFormatThinking(text) {
      if (!text) return '';
      
		const tagRegex = /<\|?(?:s_)?(?:think|thought|thinking|reasoning)(?:_start)?\|?>([\s\S]*?)(?:<\|?(?:\/|e_)?(?:think|thought|thinking|reasoning)(?:_end)?\|?>|$)/gi;
		const bracketRegex = /\[(think|thought|thinking|reasoning)\]([\s\S]*?)(?:\[\/\1\]|$)/gi;

      const replacer = (match, tag, content) => {
        const trimmed = content.trim();
        if (!trimmed) return '';
        return `\n\n<details class="thinking-block">
                  <summary>View Thinking Process</summary>
                  <div class="thinking-content">${escapeHtml(trimmed)}</div>
                </details>\n\n`;
      };

      let processed = text.replace(tagRegex, replacer);
      processed = processed.replace(bracketRegex, replacer);
      return processed;
    }

    // --- Chat History Management ---
    function loadChatsFromStorage() {
      const saved = localStorage.getItem('chat_app_history');
      if (saved) {
        try { chats = JSON.parse(saved); } catch (e) { chats = []; }
      }
    }

    function saveChatsToStorage() {
      localStorage.setItem('chat_app_history', JSON.stringify(chats));
    }

    function renderSidebar() {
      const listEl = document.getElementById('sidebarChatsList');
      listEl.innerHTML = '';
      
      chats.forEach(chat => {
        const item = document.createElement('div');
        item.className = `chat-item ${chat.id === currentChatId ? 'active' : ''}`;
        
        const titleSpan = document.createElement('span');
        titleSpan.className = 'chat-item-title';
        titleSpan.textContent = chat.title || 'New Chat';
        item.onclick = () => switchChat(chat.id);

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'chat-item-delete';
        deleteBtn.textContent = '✕';
        deleteBtn.onclick = (e) => deleteChat(chat.id, e);

        item.appendChild(titleSpan);
        item.appendChild(deleteBtn);
        listEl.appendChild(item);
      });
    }

    function createNewChat() {
      const newChat = {
        id: 'chat_' + Date.now(),
        title: 'New Chat',
        modelId: selectedModelId, 
        modelName: selectedModelName,
        messages: []
      };
      chats.unshift(newChat);
      saveChatsToStorage();
      switchChat(newChat.id);
      focusInput();
    }

    function switchChat(id) {
      currentChatId = id;
      const chat = chats.find(c => c.id === id);
      
      if (chat && chat.modelId) {
        setDisplayModel(chat.modelId, chat.modelName);
      } else if (selectedModelId) {
        setDisplayModel(selectedModelId, selectedModelName);
      }
      
      renderSidebar();
      renderCurrentChatMessages();
    }

    function deleteChat(id, event) {
      event.stopPropagation();
      chats = chats.filter(c => c.id !== id);
      saveChatsToStorage();

      if (chats.length === 0) {
        createNewChat();
      } else if (currentChatId === id) {
        switchChat(chats[0].id);
      } else {
        renderSidebar();
      }
    }

    function renderCurrentChatMessages() {
      const chatEl = document.getElementById('chat');
      chatEl.innerHTML = '';

      const chat = chats.find(c => c.id === currentChatId);
      if (!chat) return;

      chat.messages.forEach(msg => {
        const div = document.createElement('div');
        div.className = `msg ${msg.role}`;
        if (msg.role === 'user') {
          div.textContent = msg.content;
        } else {
          div.innerHTML = marked.parse(extractAndFormatThinking(msg.content));
        }
        chatEl.appendChild(div);
      });
      scrollToBottom();
    }

    // --- Custom Dropdown Logic ---
    function toggleDropdown() {
      document.getElementById('dropdownMenu').classList.toggle('show');
    }
    
    document.addEventListener('click', (e) => {
      if (!e.target.closest('#customModelSelect')) {
        document.getElementById('dropdownMenu').classList.remove('show');
      }
    });

    function setDisplayModel(id, name) {
      selectedModelId = id;
      selectedModelName = name;
      const displayObj = document.querySelector('.custom-select-display');
      displayObj.textContent = name;
      displayObj.title = name;
      localStorage.setItem('chat_model_id', id);
      
      if (currentChatId) {
        const chat = chats.find(c => c.id === currentChatId);
        if (chat) {
          chat.modelId = id;
          chat.modelName = name;
          saveChatsToStorage();
        }
      }
    }

    function selectOption(id, name) {
      setDisplayModel(id, name);
      document.getElementById('dropdownMenu').classList.remove('show');
    }

    function formatModelName(m) {
      let displayName = m.name || m.id;
      if (m.name && m.id && m.name !== m.id) {
        let cleanId = m.id;
        if (cleanId.includes('/')) {
          cleanId = cleanId.split('/').slice(1).join('/');
        }
        if (m.name.toLowerCase() !== cleanId.toLowerCase()) {
          displayName = `${m.name} (${cleanId})`;
        }
      }
      return displayName;
    }

    function saveConfig() {
      localStorage.setItem('chat_base_url', document.getElementById('baseUrl').value.trim());
      localStorage.setItem('chat_api_key', document.getElementById('apiKey').value.trim());
    }

    function onKeyInput() {
      saveConfig();
      clearTimeout(keyDebounceTimer);
      keyDebounceTimer = setTimeout(() => {
        if (document.getElementById('apiKey').value.trim()) {
          fetchModels();
        }
      }, 500);
    }

    async function fetchModels() {
      const rawUrl = document.getElementById('baseUrl').value.trim();
      const apiKey = document.getElementById('apiKey').value.trim();
      const subOnly = document.getElementById('subOnly').checked;
      
      if (!apiKey) {
        document.querySelector('.custom-select-display').textContent = 'Enter API Key above...';
        return;
      }

      document.querySelector('.custom-select-display').textContent = 'Loading models...';
      
      try {
        const basePath = rawUrl.replace(/\/v1\/?$/, "");
        const isNanoGpt = rawUrl.toLowerCase().includes('nano-gpt');
        
        // Only use the subscription endpoint if the provider is actually nano-gpt and the toggle is on
        const endpoint = (isNanoGpt && subOnly) 
          ? `${basePath}/subscription/v1/models?detailed=true` 
          : `${basePath}/v1/models?detailed=true`;
          
        const res = await fetch(endpoint, {
          headers: { 'Authorization': `Bearer ${apiKey}` }
        });
        
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        
        allModels = data.data || [];
        applyModelFilter();
        
      } catch (e) {
        document.querySelector('.custom-select-display').textContent = 'Fetch Failed';
        console.error('Failed to fetch models:', e);
      }
    }

    function applyModelFilter() {
      const filterInput = document.getElementById('modelFilter');
      const filterText = filterInput.value.toLowerCase().trim();
      const clearBtn = document.getElementById('clearFilterBtn');
      
      clearBtn.style.display = filterText ? 'block' : 'none';
      
      const terms = filterText.split(/\s+/).filter(t => t.length > 0);
      const dropdownMenu = document.getElementById('dropdownMenu');
      dropdownMenu.innerHTML = '';
      
      const filteredModels = allModels.filter(m => {
        if (terms.length === 0) return true;
        const searchableText = `${m.id} ${m.name || ''} ${m.owned_by || ''}`.toLowerCase();
        return terms.every(term => searchableText.includes(term));
      });
      
      const groups = {};
      filteredModels.forEach(m => {
        let provider = m.owned_by;
        if (!provider || provider.toLowerCase() === 'other' || provider.toLowerCase() === 'system') {
          if (m.id && m.id.includes('/')) {
            provider = m.id.split('/')[0];
          } else {
            provider = 'Other';
          }
        }
        provider = provider.toUpperCase();
        
        if (!groups[provider]) groups[provider] = [];
        groups[provider].push(m);
      });
      
      Object.keys(groups).sort().forEach(provider => {
        const groupLabel = document.createElement('div');
        groupLabel.className = 'dropdown-group-label';
        groupLabel.textContent = provider;
        dropdownMenu.appendChild(groupLabel);
        
        groups[provider].forEach(m => {
          const displayName = formatModelName(m);
          const optDiv = document.createElement('div');
          optDiv.className = 'dropdown-option';
          optDiv.textContent = displayName;
          optDiv.title = `${displayName} \nID: ${m.id}`; 
          optDiv.onclick = () => selectOption(m.id, displayName);
          dropdownMenu.appendChild(optDiv);
        });
      });
      
      if (filteredModels.length === 0) {
        document.querySelector('.custom-select-display').textContent = "No models found";
        selectedModelId = "";
      } else {
        const savedModelId = localStorage.getItem('chat_model_id');
        let targetModel = null;
        
        if (selectedModelId && filteredModels.find(m => m.id === selectedModelId)) {
          targetModel = filteredModels.find(m => m.id === selectedModelId);
        } else if (savedModelId && filteredModels.find(m => m.id === savedModelId)) {
          targetModel = filteredModels.find(m => m.id === savedModelId);
        } else {
          targetModel = filteredModels[0];
        }
        
        setDisplayModel(targetModel.id, formatModelName(targetModel));
      }
    }

    function clearFilter() {
      document.getElementById('modelFilter').value = '';
      applyModelFilter();
    }

    function handleSendClick() {
      if (currentAbortController) {
        currentAbortController.abort();
        return;
      }
      sendMessage();
    }

    async function sendMessage() {
      const input = document.getElementById('message-input');
      const sendBtn = document.getElementById('sendBtn');
      const text = input.value.trim();
      if (!text) return;

      const rawUrl = document.getElementById('baseUrl').value.trim();
      const baseUrl = rawUrl.replace(/\/$/, "");
      const apiKey = document.getElementById('apiKey').value.trim();
      const model = selectedModelId;
      
      if (!model) {
        alert("Please select a valid model first.");
        return;
      }

      const chat = chats.find(c => c.id === currentChatId);
      if (!chat) return;

      if (chat.messages.length === 0) {
        chat.title = text.length > 25 ? text.substring(0, 25) + '...' : text;
      }

      chat.messages.push({ role: 'user', content: text });
      saveChatsToStorage();
      renderSidebar();

      const chatEl = document.getElementById('chat');
      const userDiv = document.createElement('div');
      userDiv.className = 'msg user';
      userDiv.textContent = text;
      chatEl.appendChild(userDiv);
      scrollToBottom();

      input.value = '';

      const assistantDiv = document.createElement('div');
      assistantDiv.className = 'msg assistant';
      assistantDiv.innerHTML = '';
      chatEl.appendChild(assistantDiv);
      scrollToBottom();

      currentAbortController = new AbortController();
      sendBtn.textContent = 'Stop';
      sendBtn.classList.add('stop-btn');

      let accumulatedContent = '';
      let isReasoningActive = false;

      try {
        const res = await fetch(`${baseUrl}/chat/completions`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey}`
          },
          body: JSON.stringify({ model, messages: chat.messages, stream: true }),
          signal: currentAbortController.signal
        });
        
        if (!res.ok) {
          const errText = await res.text();
          let msg = `HTTP ${res.status}`;
          try {
            const errJson = JSON.parse(errText);
            msg = errJson.error?.message || errJson.error || msg;
          } catch(e) {}
          throw new Error(msg);
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder("utf-8");
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop(); // Retain unfinished line fragment

          for (const line of lines) {
            const trimmedLine = line.trim();
            if (!trimmedLine || trimmedLine.startsWith(':')) continue;
            if (trimmedLine === 'data: [DONE]') continue;

            if (trimmedLine.startsWith('data: ')) {
              try {
                const parsed = JSON.parse(trimmedLine.slice(6));
                const delta = parsed.choices?.[0]?.delta || {};

                // Handles separate API reasoning fields (e.g. DeepSeek / OpenRouter / Ollama)
                const reasoning = delta.reasoning_content || delta.reasoning || delta.thinking;
                const content = delta.content;

                if (reasoning) {
                  if (!isReasoningActive) {
                    accumulatedContent += '<think>';
                    isReasoningActive = true;
                  }
                  accumulatedContent += reasoning;
                }

                if (content) {
                  if (isReasoningActive) {
                    accumulatedContent += '</think>';
                    isReasoningActive = false;
                  }
                  accumulatedContent += content;
                }

                assistantDiv.innerHTML = marked.parse(extractAndFormatThinking(accumulatedContent));
                scrollToBottom();
              } catch (e) {
                // Ignore chunk JSON parse errors
              }
            }
          }
        }

        if (isReasoningActive) {
          accumulatedContent += '</think>';
          isReasoningActive = false;
        }

        chat.messages.push({ role: 'assistant', content: accumulatedContent });
        saveChatsToStorage();
        scrollToBottom();
        
      } catch (e) {
        if (e.name === 'AbortError') {
          if (accumulatedContent) {
            if (isReasoningActive) accumulatedContent += '</think>';
            chat.messages.push({ role: 'assistant', content: accumulatedContent });
            saveChatsToStorage();
          } else {
            assistantDiv.textContent = '[Request Cancelled]';
          }
        } else {
          assistantDiv.textContent = 'Error: ' + e.message;
        }
        scrollToBottom();
      } finally {
        currentAbortController = null;
        sendBtn.textContent = 'Send';
        sendBtn.classList.remove('stop-btn');
        focusInput();
      }
    }
  </script>

</body>
</html>

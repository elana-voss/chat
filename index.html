<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal Chat UI</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.15/dist/purify.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Collapsible Left Rail / Sidebar -->
  <div id="sidebar">
    <div class="sidebar-header">
      <button class="hamburger-btn" onclick="toggleSidebar()" title="Toggle Sidebar" aria-controls="sidebar" aria-expanded="true">☰</button>
      <button class="new-chat-btn" onclick="createNewChat()">+ New Chat</button>
    </div>
    <div class="sidebar-chats" id="sidebarChatsList"></div>
    <div class="system-prompt-panel">
      <label class="system-prompt-label" for="systemPromptInput">System Prompt</label>
      <textarea id="systemPromptInput" rows="3" placeholder="You are a helpful agent" aria-describedby="systemPromptHint"></textarea>
      <div id="systemPromptHint" class="system-prompt-hint">Saved per chat. Empty prompts are not sent.</div>
    </div>
  </div>
  <div class="sidebar-backdrop" onclick="toggleSidebar()" aria-hidden="true"></div>

  <!-- Main Content Area -->
  <div class="main-content">
    <div id="config">
      <button class="main-hamburger-btn hamburger-btn" onclick="toggleSidebar()" title="Toggle Sidebar" aria-controls="sidebar" aria-expanded="false">☰</button>
      <input type="text" id="baseUrl" placeholder="Base URL" value="https://nano-gpt.com/api/v1" onchange="saveConfig(); fetchModels();" oninput="updateSubOnlyVisibility()">
      <input type="password" id="apiKey" placeholder="API Key" onchange="saveConfig(); fetchModels();" oninput="onKeyInput()">

      <label id="subOnlyContainer">
        <input type="checkbox" id="subOnly" onchange="saveConfig(); fetchModels()"> Sub Only
      </label>

      <div class="filter-wrapper">
        <input type="text" id="modelFilter" placeholder="Filter models..." oninput="applyModelFilter()">
        <span id="clearFilterBtn" onclick="clearFilter()">&times;</span>
      </div>

      <div class="custom-select-wrapper" id="customModelSelect">
        <div class="custom-select-display" onclick="toggleDropdown()" title="Select Model">Select Model</div>
        <div class="custom-select-options" id="dropdownMenu"></div>
      </div>
    </div>

    <div id="chat"></div>

    <div id="input-box">
      <div class="composer-shell">
        <input type="text" id="message-input" placeholder="Type your message..." onkeydown="if(event.key==='Enter') handleSendClick()">
        <button id="sendBtn" class="composer-send-btn" aria-label="Send message" title="Send message" onclick="handleSendClick()">➤</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
